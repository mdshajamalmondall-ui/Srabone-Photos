name: Build Srabone APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          sudo mkdir -p "$ANDROID_SDK/licenses" "$ANDROID_SDK/platforms" "$ANDROID_SDK/build-tools"
          sudo chown -R "$(whoami)" "$ANDROID_SDK" 2>/dev/null || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK/licenses/android-sdk-preview-license"

      - name: Prepare Debug Signing Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.HeartBloomTest" --no-daemon

      - name: Build Srabone APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: |
          mkdir -p build-apk
          cp app/build/outputs/apk/debug/app-debug.apk build-apk/Srabone.apk

      - name: Upload Srabone APK
        uses: actions/upload-artifact@v4
        with:
          name: Srabone-APK
          path: build-apk/Srabone.apk
          if-no-files-found: error
          retention-days: 30
